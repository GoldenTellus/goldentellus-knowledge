name: Knowledge Content Check

on:
  pull_request:
    paths:
      - '00-pipeline-fundamentals/**/*.md'
      - '01-lead-fde/**/*.md'
      - '02-analyst/**/*.md'
      - '03-architect/**/*.md'
      - '04-builder/**/*.md'
      - '05-data-engineer/**/*.md'
      - '06-integrator/**/*.md'
      - '07-ops/**/*.md'
      - '08-industry-specific/**/*.md'
      - 'learning/**/*.md'
      - 'scripts/**/*.py'
      - 'scripts/**/*.json'
      - 'tests/**/*.py'
      - '.github/workflows/knowledge-lint.yml'
  push:
    branches: [main]
    paths:
      - '00-pipeline-fundamentals/**/*.md'
      - '01-lead-fde/**/*.md'
      - '02-analyst/**/*.md'
      - '03-architect/**/*.md'
      - '04-builder/**/*.md'
      - '05-data-engineer/**/*.md'
      - '06-integrator/**/*.md'
      - '07-ops/**/*.md'
      - '08-industry-specific/**/*.md'
      - 'learning/**/*.md'
      - 'scripts/**/*.py'
      - 'scripts/**/*.json'
      - 'tests/**/*.py'
      - '.github/workflows/knowledge-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Check knowledge frontmatter
        run: python scripts/validate_knowledge.py
